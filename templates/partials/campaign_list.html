{% if campaigns %}
<div class="overflow-x-auto">
<table class="min-w-full divide-y divide-gray-200">
    <thead>
        <tr>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Opens</th>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Clicks</th>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created At</th>
            <th class="px-3 lg:px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {% for c in campaigns %}
        <tr>
            <td class="px-3 lg:px-4 py-4 text-sm font-medium text-gray-900 max-w-[100px] sm:max-w-[150px] lg:max-w-[180px] xl:max-w-xs truncate" title="{{ c.name }}">{{ c.name }}</td>
            <td class="px-3 lg:px-4 py-4 whitespace-nowrap text-sm text-gray-500">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                    {{ c.status }}
                </span>
            </td>
            <td class="px-3 lg:px-4 py-4 whitespace-nowrap text-sm text-gray-500 font-semibold">{{ c.open_count }}</td>
            <td class="px-3 lg:px-4 py-4 whitespace-nowrap text-sm text-red-600 font-bold">{{ c.click_count }}</td>
            <td class="px-3 lg:px-4 py-4 whitespace-nowrap text-sm text-gray-500">{{ c.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
            <td class="px-3 lg:px-4 py-4 whitespace-nowrap text-sm font-medium space-x-3">
                <a href="{{ url_for('campaign_details', id=c.id) }}" class="text-blue-600 hover:text-blue-900">View</a>
                <span class="text-gray-300">|</span>
                <button hx-post="{{ url_for('delete_campaign', id=c.id) }}"
                        hx-target="#campaign-list"
                        hx-confirm="Are you sure you want to delete this campaign? All tracking data for it will be lost."
                        class="text-red-600 hover:text-red-900 bg-transparent border-0 p-0 cursor-pointer inline font-medium">
                    Delete
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% else %}
<p class="text-gray-500">No campaigns found. <a href="{{ url_for('new_campaign') }}" class="text-blue-600 hover:underline">Create one</a>.</p>
{% endif %}
