{% extends "base.html" %}
{% block header %}Phishing Templates{% endblock %}
{% block content %}
<style>
    .template-body a, .template-body button {
        pointer-events: none !important;
        cursor: default !important;
        text-decoration: none !important;
    }
</style>
<div class="bg-white shadow rounded-lg p-6">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        {% for template in templates %}
        <div class="border rounded-lg p-6 flex flex-col bg-white hover:shadow-md transition-shadow duration-200">
            <h3 class="text-2xl font-bold text-gray-900 mb-2">{{ template.name }}</h3>
            <p class="text-lg text-gray-600 mb-4 flex-1"><strong>Subject:</strong> {{ template.subject }}</p>
            <div class="template-body bg-gray-50 p-4 rounded text-base text-gray-700 overflow-y-auto max-h-48 border leading-relaxed">
                {{ template.body_html | safe }}
            </div>
        </div>
        {% endfor %}
    </div>
</div>{% endblock %}
